<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Liara Yoga Studio</title>
<meta name="description" content="Liara is a quiet yoga studio in Astana.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ccircle cx='5' cy='5' r='5' fill='%23c9387f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="main"><section class="sec"><div class="wrap" style="max-width:520px"><p class="eyebrow">Account</p><h1 class="h2">Welcome to Liara</h1>
<div class="msg-ok mb-3" style="background:var(--lav);color:var(--text);border-color:var(--line)">Demo only: data is stored in your browser. Please do not use a real password.</div>
<div class="mb-3"><button type="button" class="btn-line btn-sm me-2" id="tabIn" aria-pressed="true">Log in</button><button type="button" class="btn-line btn-sm" id="tabUp" aria-pressed="false">Sign up</button></div>
<form class="cardx" id="loginForm" novalidate><label class="form-label" for="lEmail">Email</label><input class="form-control" id="lEmail" type="email" autocomplete="username"><div class="err" id="elEmail"></div>
<label class="form-label mt-2" for="lPass">Password</label><input class="form-control" id="lPass" type="password" autocomplete="current-password"><div class="err" id="elPass"></div><div class="err" id="elForm" role="alert"></div><button class="btn-liara mt-2" type="submit">Log in</button></form>
<form class="cardx" id="signForm" novalidate hidden><label class="form-label" for="sName">Full name</label><input class="form-control" id="sName" autocomplete="name"><div class="err" id="esName"></div>
<label class="form-label mt-2" for="sEmail">Email</label><input class="form-control" id="sEmail" type="email" autocomplete="email"><div class="err" id="esEmail"></div>
<label class="form-label mt-2" for="sPass">Password (min. 6 characters, with a digit)</label><input class="form-control" id="sPass" type="password" autocomplete="new-password"><div class="err" id="esPass"></div>
<label class="form-label mt-2" for="sPass2">Repeat password</label><input class="form-control" id="sPass2" type="password" autocomplete="new-password"><div class="err" id="esPass2"></div><div id="sOk" aria-live="polite"></div><button class="btn-liara mt-2" type="submit">Create account</button></form></div></section></main>
<footer id="site-footer"></footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
